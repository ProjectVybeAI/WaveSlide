# Lint, typecheck and unit/API tests on macOS and Windows. No webcam or keyboard access is needed:
# the engine runs on replay sources and records keys instead of pressing them.
name: ci
on:
  push:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: uv sync --locked
        working-directory: backend
      - run: npm run ci
